# HigherPays — the ledger app for creator agencies.
# Fronted by nginx on the EC2; the container listens on 127.0.0.1:8083.
#
# Install: copy to /etc/nginx/sites-available/higherpays, symlink into
# sites-enabled, `nginx -t && systemctl reload nginx`. Certificates come from
# `certbot certonly --webroot -w /var/www/html -d higherpays.com -d www.higherpays.com`.

# Port 80 only answers the ACME challenge; everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name higherpays.com www.higherpays.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name higherpays.com www.higherpays.com;

    ssl_certificate     /etc/letsencrypt/live/higherpays.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/higherpays.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tokens and customer data cross this proxy; never let a client downgrade.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass         http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
