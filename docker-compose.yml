# HigherPays — full stack in three slim containers.
#
# postgres  → data
# backend   → Node/Express API on :3000 (internal only)
# frontend  → nginx serving the built React app on :8083 (public), proxying
#             /api/* to the backend
#
# Env values below default for local dev but are meant to be overridden by an
# .env file next to this compose file (production/EC2). Never commit real
# secrets — see .env.example for the shape.

services:
  postgres:
    image: postgres:16-alpine
    container_name: higherpays-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: higherpays
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      HP_APP_PASSWORD: ${HP_APP_PASSWORD:-hp_app_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/00-hp-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d higherpays"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: higherpays-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Runtime uses the restricted role. Migrations use the owner role.
      DATABASE_URL: postgres://hp_app:${HP_APP_PASSWORD:-hp_app_dev}@postgres:5432/higherpays
      MIGRATIONS_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-devpass}@postgres:5432/higherpays
      USE_RLS: "true"
      PGUSER: hp_app
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES:-EUR}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-false}
      SEED_ORG: ${SEED_ORG:-Demo Agency}
      SEED_NAME: ${SEED_NAME:-Demo Owner}
      SEED_EMAIL: ${SEED_EMAIL:-owner@example.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-change-me-please}
      # Provider (leave empty until MantaPay integration is turned on).
      MANTAPAY_MERCHANT_ID: ${MANTAPAY_MERCHANT_ID:-}
      MANTAPAY_HASH_KEY: ${MANTAPAY_HASH_KEY:-}
      # Public base for MantaPay's notification callback. Baked into every
      # signed checkout URL as notification_url.
      WEBHOOK_PUBLIC_BASE: ${WEBHOOK_PUBLIC_BASE:-}
    # No ports exposed — the frontend nginx proxies /api/ to us over the
    # internal Docker network.
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: higherpays
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8083:80"

volumes:
  pgdata:
