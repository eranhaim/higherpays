# HigherPays — full stack in three slim containers.
#
# postgres  → data
# backend   → Node/Express API on :3000 (internal only)
# frontend  → nginx serving the built React app on :8083 (public), proxying
#             /api/* to the backend
#
# Configuration comes from the .env file next to this compose file (see
# .env.example). Secrets have no defaults: compose refuses to start without
# them rather than booting production on a value committed to this repo.

services:
  postgres:
    image: postgres:16-alpine
    container_name: higherpays-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: higherpays
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      HP_APP_PASSWORD: ${HP_APP_PASSWORD:?HP_APP_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/00-hp-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d higherpays"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: higherpays-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Every backend setting is read from .env as-is; the values below are the
    # ones compose has to compute or pin.
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Runtime uses the restricted role. Migrations use the owner role.
      DATABASE_URL: postgres://hp_app:${HP_APP_PASSWORD:?HP_APP_PASSWORD must be set in .env}@postgres:5432/higherpays
      MIGRATIONS_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/higherpays
      PGUSER: hp_app
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    # No ports exposed — the frontend nginx proxies /api/ to us over the
    # internal Docker network.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Non-root process (Dockerfile), immutable filesystem, bounded resources.
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: higherpays
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8083:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    mem_limit: 128m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
